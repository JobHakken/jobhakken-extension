<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>First2Apply</title>
    <style>
      :root { color-scheme: light dark; }
      body { width: 260px; margin: 0; padding: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
      .mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #5457d6, #0f9d6b); display: grid; place-items: center; color: #fff; font-size: 12px; }
      .nm { font-weight: 700; font-size: 14px; }
      .status { font-size: 12px; margin: 8px 0 12px; display: flex; align-items: center; gap: 7px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; }
      .connected { background: #0f9d6b; } .standalone { background: #5457d6; } .none { background: #c2740c; }
      button { width: 100%; border: none; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
      .primary { background: #5457d6; color: #fff; } .primary:hover { filter: brightness(1.06); }
      .ghost { background: transparent; border: 1px solid #d9dce3; color: inherit; margin-top: 8px; }
      .msg { font-size: 12px; color: #6b7280; margin-top: 10px; min-height: 15px; }
    </style>
  </head>
  <body>
    <div class="hd"><span class="mark">⚡</span><span class="nm">First2Apply</span></div>
    <div class="status"><span class="dot none" id="dot"></span><span id="statusText">Checking…</span></div>
    <button class="primary" id="autofill">⚡ Autofill this page</button>
    <button class="ghost" id="options">Profile &amp; settings</button>
    <div class="msg" id="msg"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
