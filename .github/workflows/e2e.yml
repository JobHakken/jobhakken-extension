name: E2E (Playwright)

# Real-Chromium end-to-end: loads the built extension into Chromium and drives it against
# local ATS fixtures (served by scripts/serve-fixtures.mjs) + a mock desktop bridge. Heavy
# (real browser), so it does NOT run on every push/PR — it runs on release tags (ext-v*) as a
# pre-publish gate and on demand. Run locally anytime with `npm run test:e2e`.
on:
  workflow_dispatch:
  push:
    tags:
      - 'ext-v*'

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jobhakken'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
