# Dependabot: grouped, non-breaking updates only. We pin an intentionally-tested toolchain,
# so major version-updates are ignored (adopt majors deliberately, by hand); security fixes
# and minor/patch bumps still flow. Targets develop (the integration branch).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Majors are adopted deliberately (they've broken CI here — eslint 10, typescript 7, etc.).
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      minor-and-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
